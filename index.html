<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Exile monitors your Discord server for spam and stops it."
    >
    <title>Exile — Discord moderation</title>
    <link rel="icon" href="data:,">
    <link
      rel="preload"
      href="/assets/fonts/atkinson-hyperlegible-next-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    >
    <link
      rel="preload"
      href="/assets/fonts/karrik-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    >
    <link rel="stylesheet" href="styles.css?v=2">
  </head>
  <body>
    <header class="masthead">
      <a class="wordmark" href="/" aria-label="Exile home">Exile</a>
      <nav class="primary-nav" aria-label="Primary navigation">
        <a href="/" aria-current="page">Home</a>
        <a href="#contact">Contact</a>
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a>
      </nav>
    </header>

    <main class="home-page">
      <div class="hero">
      <section class="introduction" aria-labelledby="page-title">
        <h1 id="page-title">Exile</h1>
        <p class="summary">
          Exile monitors your Discord server for spam and stops it.
        </p>
      </section>

      <figure class="hero-art">
        <img src="assets/lore-grub.png" alt="Exile watching a small grub on the ground." fetchpriority="high">
      </figure>
      </div>

      <section class="contact" id="contact" aria-labelledby="contact-title">
        <div class="contact-copy">
          <h2 id="contact-title">Contact</h2>
        </div>

        <form
          class="contact-form"
          name="contact"
          method="post"
          action="/thanks/"
          data-netlify="true"
          netlify-honeypot="bot-field"
        >
          <input type="hidden" name="form-name" value="contact">
          <p class="form-trap">
            <label>Do not fill this out <input name="bot-field" tabindex="-1" autocomplete="off"></label>
          </p>

          <label for="contact-name">Name <span>(optional)</span></label>
          <input id="contact-name" name="name" type="text" autocomplete="name">

          <label for="contact-email">Email</label>
          <input id="contact-email" name="email" type="email" autocomplete="email" required>

          <label for="contact-message">Message</label>
          <textarea id="contact-message" name="message" rows="6" required></textarea>

          <button type="submit">Send</button>
        </form>
      </section>
    </main>
    <footer class="site-footer">
      Made with 🖤 by <a href="https://github.com/intelagense">intelagense</a>
    </footer>
  </body>
</html>
